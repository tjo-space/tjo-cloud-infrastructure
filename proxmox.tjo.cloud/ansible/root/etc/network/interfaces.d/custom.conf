{% if inventory_hostname == "nevaroo" %}
# We add additional IPv6 addresses to the main interface
# for nevaroo. TODO: Expose this in tfvars or vars.yaml somehow.
iface vmbr0 inet6 static
	address 2a01:4f8:120:7700::1/128
	gateway fe80::1
  post-up ip -6 route add 2a01:4f8:120:7700::3 dev vmbr0
  post-up ip -6 route add 2a01:4f8:120:7700::/56 via 2a01:4f8:120:7700::3 dev vmbr0
{% endif %}

{% if inventory_hostname != "nevaroo" %}
# Enable SLAAC for ipv6
iface vmbr0 inet6 static auto
  accept_ra 2
{% endif %}

# Disable SLAAC on vmbr2
iface vmbr2 inet6 static auto
  accept_ra 0
